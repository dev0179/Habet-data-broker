<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mission Control Gauges</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/justgage/1.2.9/justgage.min.css"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #00ffcc;
    }
    #connectionStatus {
      margin: 10px 0;
      font-weight: bold;
    }
    .gauge-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      margin-top: 30px;
    }
    .gauge-box {
      width: 200px;
      height: 160px;
      background-color: #222;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,255,255,0.3);
    }
    .gauge-label {
      margin-top: 5px;
      color: #ccc;
    }
  </style>
</head>
<body>

<h1>Mission Control - Live Telemetry</h1>
<div id="connectionStatus">Connecting to WebSocket...</div>

<div class="gauge-container">
  <div class="gauge-box"><div id="latitude-gauge"></div><div class="gauge-label">Latitude</div></div>
  <div class="gauge-box"><div id="longitude-gauge"></div><div class="gauge-label">Longitude</div></div>
  <div class="gauge-box"><div id="altitude-gauge"></div><div class="gauge-label">Altitude</div></div>
  <div class="gauge-box"><div id="speed-gauge"></div><div class="gauge-label">Speed</div></div>
  <div class="gauge-box"><div id="temperature-gauge"></div><div class="gauge-label">Temperature</div></div>
  <div class="gauge-box"><div id="humidity-gauge"></div><div class="gauge-label">Humidity</div></div>
  <div class="gauge-box"><div id="pressure-gauge"></div><div class="gauge-label">Pressure</div></div>
  <div class="gauge-box"><div id="voltage-gauge"></div><div class="gauge-label">Voltage</div></div>
</div>

<script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/justgage/1.2.9/justgage.min.js"></script>
<script src="user.js"></script>

</body>
</html>
