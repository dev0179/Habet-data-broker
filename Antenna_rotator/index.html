<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rotator Control Interface</title>
  <link rel="stylesheet" href="style.css" />
  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rotator Control Interface</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.0/socket.io.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
  <button class="toggle-mode" onclick="toggleMode()">Toggle Dark/Light</button>

  <!-- Main Top Section: Live Data + Rotator Control -->
  <div class="top-section">
    <!-- Live Data Box -->
    <div class="coordinate-box">
      <div class="data-line"><div class="label">Latitude</div><div class="value" id="lat">--</div></div>
      <div class="data-line"><div class="label">Longitude</div><div class="value" id="lon">--</div></div>
      <div class="data-line"><div class="label">Altitude</div><div class="value" id="alt">--</div></div>
      <div class="data-line"><div class="label">Speed</div><div class="value" id="speed">--</div></div>
      <div class="data-line"><div class="label">Pressure</div><div class="value" id="pressure">--</div></div>
      <div class="data-line"><div class="label">Temperature</div><div class="value" id="temp">--</div></div>
      <div class="data-line"><div class="label">Humidity</div><div class="value" id="humidity">--</div></div>
      <div class="data-line"><div class="label">Volt</div><div class="value" id="volt">--</div></div>
    </div>

    <!-- Rotator Control Box -->
    <div class="rotator-box">
      <h1>Rotator Control</h1>
      <p id="connectionStatus" class="disconnected">Disconnected from WebSocket</p>
      <p id="rotatorStatus" class="not-found">Rotator Status: Not connected</p>

      <div class="status-box">
        <h2>Automatic Tracking</h2>
        <p>Azimuth: <span id="azimuth">--</span>°</p>
        <p>Elevation: <span id="elevation">--</span>°</p>
      </div>

      <div class="status-box">
        <h2>Manual Control</h2>
        <input type="number" id="azimuthInput" placeholder="Azimuth (0-360)" min="0" max="360">
        <input type="string" id="elevationInput" placeholder="Elevation (0-180)" min="0" max="180">
        <br>
        <button onclick="sendRotation()">Rotate</button>
        <br>
        <button onclick="toggleManualControl()">Toggle Manual Control</button>
        <h3 id="manualStatus">Auto mode active</h3>
      </div>

      <div id="commandSentBox" class="command-sent-box">Command Sent</div>
    </div>
    <div id="map" class="map-container"></div> <!-- Map Container -->
  </div>

  <!-- Graphs Section -->
  <div class="graph-section">
    <h2 style="margin-top: 40px; text-align: center;">Create New Live Graphs</h2>
    <label for="xSelect">X-axis:</label>
    <select id="xSelect">
      <option value="alt">Altitude</option>
      <option value="temperature">Temperature</option>
      <option value="pressure">Pressure</option>
      <option value="humidity">Humidity</option>
      <option value="volt">Volt</option>
      <option value="GPS_Speed">Speed</option>
    </select>

    <label for="ySelect">Y-axis:</label>
    <select id="ySelect">
      <option value="temperature">Temperature</option>
      <option value="alt">Altitude</option>
      <option value="pressure">Pressure</option>
      <option value="humidity">Humidity</option>
      <option value="volt">Volt</option>
      <option value="GPS_Speed">Speed</option>
    </select>

    <button onclick="createGraph()">Create Graph</button>
    <div id="customGraphs" class="custom-graph-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
